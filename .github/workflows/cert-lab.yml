name: Cert Lab ERP

# Gate de comprobación del sistema pyme (reemplaza el lab AFIP/CRM borrado).
# Debe quedar GREEN: sync Windows, stock, outbox, dominio y menú del local.

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - 'cursor/**'
  pull_request:

jobs:
  sistema-pyme-core:
    name: Cert Lab protocolo P0 (GREEN obligatorio)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Windows sync / anti-crash
        run: |
          flutter test \
            test/windows_sync_fast_safe_test.dart \
            test/windows_anti_crash_invariants_test.dart
      - name: Sync outbox + stock convergencia
        run: |
          flutter test \
            test/sync_outbox_pending_breakdown_test.dart \
            test/sync_outbox_reclaim_dead_test.dart \
            test/sync_outbox_reopen_acked_test.dart \
            test/sync_scheduler_outbox_test.dart \
            test/sync_stock_convergence_p0_test.dart \
            test/stock_ops_integridad_piloto_test.dart \
            test/stock_ops_watermark_v2_test.dart \
            test/soft_delete_stock_lww_test.dart \
            test/stock_kpi_consistencia_test.dart \
            test/productos_conteo_stock_kpi_test.dart \
            test/garantias_g1_g6_secuencia_adversa_test.dart \
            test/forense_stock_ops_idempotencia_test.dart
      - name: Dominio local (comprobantes / pagos / CC)
        run: |
          flutter test \
            test/pagos_parciales_remito_test.dart \
            test/cuenta_corriente_remoto_test.dart \
            test/offline_alta_local_test.dart \
            test/listas_precio_offline_test.dart \
            test/ui_modo_menu_test.dart
      - name: Capacidades 1–9 (regresión)
        run: |
          flutter test \
            test/capacidad1_seguridad_test.dart \
            test/capacidad2_sync_test.dart \
            test/capacidad3_dominio_test.dart \
            test/capacidad4_autorizacion_test.dart \
            test/capacidad5_backup_test.dart \
            test/capacidad6_integridad_test.dart \
            test/capacidad7_deletes_convergencia_test.dart \
            test/capacidad8_reconciliacion_test.dart \
            test/capacidad9_catchup_test.dart

  sistema-pyme-full:
    name: Cert Lab full (protocolo + P0-99 inbound)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Suite completa (sin tags cert-lab legacy)
        run: flutter test --exclude-tags cert-lab
      - name: Windows policy hardCap
        run: flutter test test/windows_sync_fast_safe_test.dart
